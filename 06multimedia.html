<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MULTIMEDIA</title>
</head>
<body>
  <center>
    <h1>MULTIMEDIA HTML</h1>

    <h3><a href="index.html">REGRESAR</a></h3>

    <h3>1. EJEMPLO VIDEO 1</h3>
      <video width="640" height="360" controls autoplay muted loop poster="img/tim.jpg">
      <source src="archivo/video2.mp4" type="video/mp4">
      Tu navegador no soporta la etiqueta video.
    </video>

    <h3>2. EJEMPLO AUDIO 1</h3>
      <audio controls autoplay loop>
      <source src="archivo/nueva.mp3" type="audio/mpeg">
      Tu navegador no soporta la etiqueta audio.
    </audio>

    <h3>3. EJEMPLO VIDEO CON SUBTITULOS </h3>
      <video controls width="800"  height="300" controls>
      <source src="Archivo/lady.mp4" type="video/mp4">
      <track 
        src="archivo/subtitulos.vtt" 
        kind="subtitles" 
        srclang="es" 
        label="Español" 
        default>
    </video>


    <h3>4. EJEMPLO IMAGEN CON RUTA RELAVITA </h3>
    <img src="img/tim.webp" alt="TIM BERNES LEE" width="400" height="300" loading="lazy" border="10px">
    
    
    <h3>5. EJEMPLO IMAGEN CON RUTA ABSOLUTA</h3>
    <img src="https://media1.tenor.com/m/lKAvopwdymkAAAAC/cecyto-saludos.gif" width="400" height="300" loading="lazy" border="10px">
    

    <h3>6. EJEMPLO FIGURE</h3>
    <figure>
    <img src="img/lis.webp" alt="Sematica HTML">
    <figcaption>Figura 1. Estructura semantica HTML.</figcaption>
  </figure>

    <h3> EJEMPLO SWF CON EMBED </h3>
         <embed 
        src="animacion.swf"
        width="800"
        height="600"
        type="application/x-shockwave-flash">


  <h3>8. EJEMPLO CANVAS</h3>
  <canvas id="miCanvas" width="300" height="200"></canvas>

  <script>
    const ctx = document.getElementById("miCanvas").getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(20, 20, 150, 100);
  </script>


  <h3>9. EJEMPLO SVG</h3>
    <img src="img/e1.jpg" alt="Mi imagen SVG" width="300">
    <svg width="100" height="100">
    <circle cx="50" cy="50" r="40" fill="green" />
  </svg>

</center>

</body>
</html>
